name: Authenticated E2E Evidence

on:
  workflow_run:
    workflows: ["Vercel Live Smoke Evidence"]
    types: [completed]
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Exact protected Vercel deployment origin (https://*.vercel.app)"
        required: true
        type: string
      expected_git_sha:
        description: "Full 40-character Git SHA expected at the target deployment"
        required: true
        type: string
      live_evidence_run_id:
        description: "Successful Vercel Live Smoke Evidence run that sealed the launch verdict"
        required: true
        type: string

permissions: {}

jobs:
  authorize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
      target_origin: ${{ steps.authorize.outputs.target_origin }}
      source_git_sha: ${{ steps.authorize.outputs.source_git_sha }}
      source_run_id: ${{ steps.authorize.outputs.source_run_id }}
      manifest_sha256: ${{ steps.authorize.outputs.manifest_sha256 }}
      verdict_sha256: ${{ steps.authorize.outputs.verdict_sha256 }}
      authorization_basis: ${{ steps.authorize.outputs.authorization_basis }}
      trusted_promotion_sha256: ${{ steps.authorize.outputs.trusted_promotion_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install minimal verifier runtime
        run: |
          python -m pip install uv
          uv sync --locked

      - name: Validate credential-free authorization gate locally
        run: uv run python scripts/authorize_authenticated_e2e.py --self-test

      - name: Resolve sealed source run
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          AUTO_RUN_ID: ${{ github.event.workflow_run.id }}
          AUTO_GIT_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_RUN_ID: ${{ inputs.live_evidence_run_id }}
          MANUAL_GIT_SHA: ${{ inputs.expected_git_sha }}
          MANUAL_DEPLOYMENT_URL: ${{ inputs.deployment_url }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            run_id="$AUTO_RUN_ID"
            git_sha="$AUTO_GIT_SHA"
            deployment_url=""
          else
            run_id="$MANUAL_RUN_ID"
            git_sha="$MANUAL_GIT_SHA"
            deployment_url="$MANUAL_DEPLOYMENT_URL"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "invalid source run id"; exit 1; }
          [[ "$git_sha" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "invalid expected git sha"; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "git_sha=$git_sha" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify source evidence workflow identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          EXPECTED_GIT_SHA: ${{ steps.source.outputs.git_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "invalid source run id"; exit 1; }
          [[ "$EXPECTED_GIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "invalid expected git sha"; exit 1; }
          api="repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID"
          test "$(gh api "$api" --jq '.name')" = "Vercel Live Smoke Evidence"
          test "$(gh api "$api" --jq '.event')" = "deployment_status"
          test "$(gh api "$api" --jq '.status')" = "completed"
          test "$(gh api "$api" --jq '.conclusion')" = "success"
          test "$(gh api "$api" --jq '.head_sha')" = "$EXPECTED_GIT_SHA"
          test "$(gh api "$api" --jq '.head_branch')" = "main"
          echo "source evidence workflow identity OK"

      - name: Download sealed launch bundle with bounded retry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          uv run python scripts/download_run_artifact.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --artifact "vercel-$SOURCE_RUN_ID.json" \
            --output "artifacts/launch-gate/health/vercel-$SOURCE_RUN_ID.json"
          uv run python scripts/download_run_artifact.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --artifact "vercel-trust-$SOURCE_RUN_ID.json" \
            --output "artifacts/launch-gate/trust/vercel-trust-$SOURCE_RUN_ID.json"
          uv run python scripts/download_run_artifact.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --artifact "vercel-manifest-$SOURCE_RUN_ID.json" \
            --output "artifacts/launch-gate/manifest/vercel-manifest-$SOURCE_RUN_ID.json"
          uv run python scripts/download_run_artifact.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --artifact "vercel-launch-verdict-$SOURCE_RUN_ID.json" \
            --output "artifacts/launch-gate/verdict/vercel-launch-verdict-$SOURCE_RUN_ID.json"

      - name: Build Trusted Promotion Proof when public observer is HOLD
        id: trusted-promotion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          EXPECTED_GIT_SHA: ${{ steps.source.outputs.git_sha }}
        run: |
          set -euo pipefail
          verdict="artifacts/launch-gate/verdict/vercel-launch-verdict-$SOURCE_RUN_ID.json"
          status="$(jq -r '.status' "$verdict")"
          if [[ "$status" == "READY_FOR_AUTHENTICATED_E2E" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "public launch verdict already authorizes authenticated E2E"
            exit 0
          fi
          test "$status" = "HOLD"

          uv run python scripts/download_run_artifact.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --artifact "vercel-trusted-source-$SOURCE_RUN_ID.json" \
            --output "artifacts/launch-gate/trusted/vercel-trusted-source-$SOURCE_RUN_ID.json"

          verified_trusted="$(uv run python scripts/verify_vercel_trusted_source_artifact.py \
            "artifacts/launch-gate/trusted/vercel-trusted-source-$SOURCE_RUN_ID.json")"
          trusted_outcome="$(jq -r '.outcome' <<<"$verified_trusted")"
          if [[ "$trusted_outcome" != "TRUSTED_SOURCE_ACCEPTED_READY_AND_ANONYMOUS_DENIED" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "trusted_source_outcome=$trusted_outcome" >> "$GITHUB_OUTPUT"
            echo "trusted source is valid but not promotable; keeping authenticated E2E on HOLD"
            exit 0
          fi

          uv run python scripts/build_trusted_promotion_proof.py \
            "artifacts/launch-gate/health/vercel-$SOURCE_RUN_ID.json" \
            "artifacts/launch-gate/trust/vercel-trust-$SOURCE_RUN_ID.json" \
            "artifacts/launch-gate/manifest/vercel-manifest-$SOURCE_RUN_ID.json" \
            "$verdict" \
            "artifacts/launch-gate/trusted/vercel-trusted-source-$SOURCE_RUN_ID.json" \
            --expected-git-sha "$EXPECTED_GIT_SHA" \
            --source-run-id "$SOURCE_RUN_ID" \
            --output "artifacts/launch-gate/trusted-promotion-$SOURCE_RUN_ID.json"

          uv run python scripts/verify_trusted_promotion_proof.py \
            "artifacts/launch-gate/health/vercel-$SOURCE_RUN_ID.json" \
            "artifacts/launch-gate/trust/vercel-trust-$SOURCE_RUN_ID.json" \
            "artifacts/launch-gate/manifest/vercel-manifest-$SOURCE_RUN_ID.json" \
            "$verdict" \
            "artifacts/launch-gate/trusted/vercel-trusted-source-$SOURCE_RUN_ID.json" \
            "artifacts/launch-gate/trusted-promotion-$SOURCE_RUN_ID.json" \
            --expected-git-sha "$EXPECTED_GIT_SHA" \
            --source-run-id "$SOURCE_RUN_ID"

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Authorize privileged authenticated E2E
        id: authorize
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          DEPLOYMENT_URL: ${{ steps.source.outputs.deployment_url }}
          EXPECTED_GIT_SHA: ${{ steps.source.outputs.git_sha }}
        run: |
          set -euo pipefail
          args=(
            "artifacts/launch-gate/health/vercel-$SOURCE_RUN_ID.json"
            "artifacts/launch-gate/trust/vercel-trust-$SOURCE_RUN_ID.json"
            "artifacts/launch-gate/manifest/vercel-manifest-$SOURCE_RUN_ID.json"
            "artifacts/launch-gate/verdict/vercel-launch-verdict-$SOURCE_RUN_ID.json"
            --expected-git-sha "$EXPECTED_GIT_SHA"
            --deployment-url "$DEPLOYMENT_URL"
            --source-run-id "$SOURCE_RUN_ID"
          )
          if [[ -f "artifacts/launch-gate/trusted-promotion-$SOURCE_RUN_ID.json" ]]; then
            args+=(
              --trusted-source "artifacts/launch-gate/trusted/vercel-trusted-source-$SOURCE_RUN_ID.json"
              --trusted-promotion "artifacts/launch-gate/trusted-promotion-$SOURCE_RUN_ID.json"
            )
          fi
          result="$(uv run python scripts/authorize_authenticated_e2e.py "${args[@]}")"
          echo "$result"
          authorized="$(jq -r '.authorized' <<<"$result")"
          [[ "$authorized" == "true" || "$authorized" == "false" ]] || {
            echo "invalid authorization result"; exit 1;
          }
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
          echo "target_origin=$(jq -r '.target_origin' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "source_git_sha=$(jq -r '.workflow_source_git_sha' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$(jq -r '.manifest_sha256' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "verdict_sha256=$(jq -r '.verdict_sha256' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "authorization_basis=$(jq -r '.authorization_basis' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "trusted_promotion_sha256=$(jq -r '.trusted_promotion_sha256 // ""' <<<"$result")" >> "$GITHUB_OUTPUT"

  privileged-e2e:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install minimal collector runtime
        run: |
          python -m pip install uv
          uv sync --locked

      - name: Validate authenticated evidence harness locally
        run: |
          uv run python scripts/verify_authenticated_collection.py --self-test
          uv run python scripts/verify_authenticated_collection_artifact.py --self-test
          uv run python scripts/verify_authenticated_e2e_promotion.py --self-test

      - name: Download authorized launch bundle with bounded retry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.authorize.outputs.source_run_id }}
        run: |
          set -euo pipefail
          uv run python scripts/download_run_artifact.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --artifact "vercel-$SOURCE_RUN_ID.json" \
            --output "artifacts/launch-gate/health/vercel-$SOURCE_RUN_ID.json"
          uv run python scripts/download_run_artifact.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --artifact "vercel-trust-$SOURCE_RUN_ID.json" \
            --output "artifacts/launch-gate/trust/vercel-trust-$SOURCE_RUN_ID.json"
          uv run python scripts/download_run_artifact.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --artifact "vercel-manifest-$SOURCE_RUN_ID.json" \
            --output "artifacts/launch-gate/manifest/vercel-manifest-$SOURCE_RUN_ID.json"
          uv run python scripts/download_run_artifact.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --artifact "vercel-launch-verdict-$SOURCE_RUN_ID.json" \
            --output "artifacts/launch-gate/verdict/vercel-launch-verdict-$SOURCE_RUN_ID.json"

      - name: Independently rebuild authorized Trusted Promotion Proof
        if: needs.authorize.outputs.authorization_basis == 'trusted_promotion_proof'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.authorize.outputs.source_run_id }}
          EXPECTED_GIT_SHA: ${{ needs.authorize.outputs.source_git_sha }}
          AUTHORIZED_PROMOTION_SHA: ${{ needs.authorize.outputs.trusted_promotion_sha256 }}
        run: |
          set -euo pipefail
          uv run python scripts/download_run_artifact.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --artifact "vercel-trusted-source-$SOURCE_RUN_ID.json" \
            --output "artifacts/launch-gate/trusted/vercel-trusted-source-$SOURCE_RUN_ID.json"

          uv run python scripts/build_trusted_promotion_proof.py \
            "artifacts/launch-gate/health/vercel-$SOURCE_RUN_ID.json" \
            "artifacts/launch-gate/trust/vercel-trust-$SOURCE_RUN_ID.json" \
            "artifacts/launch-gate/manifest/vercel-manifest-$SOURCE_RUN_ID.json" \
            "artifacts/launch-gate/verdict/vercel-launch-verdict-$SOURCE_RUN_ID.json" \
            "artifacts/launch-gate/trusted/vercel-trusted-source-$SOURCE_RUN_ID.json" \
            --expected-git-sha "$EXPECTED_GIT_SHA" \
            --source-run-id "$SOURCE_RUN_ID" \
            --output "artifacts/launch-gate/trusted-promotion-$SOURCE_RUN_ID.json"

          uv run python scripts/verify_trusted_promotion_proof.py \
            "artifacts/launch-gate/health/vercel-$SOURCE_RUN_ID.json" \
            "artifacts/launch-gate/trust/vercel-trust-$SOURCE_RUN_ID.json" \
            "artifacts/launch-gate/manifest/vercel-manifest-$SOURCE_RUN_ID.json" \
            "artifacts/launch-gate/verdict/vercel-launch-verdict-$SOURCE_RUN_ID.json" \
            "artifacts/launch-gate/trusted/vercel-trusted-source-$SOURCE_RUN_ID.json" \
            "artifacts/launch-gate/trusted-promotion-$SOURCE_RUN_ID.json" \
            --expected-git-sha "$EXPECTED_GIT_SHA" \
            --source-run-id "$SOURCE_RUN_ID"

          rebuilt="$(jq -r '.promotion_sha256' "artifacts/launch-gate/trusted-promotion-$SOURCE_RUN_ID.json")"
          test -n "$AUTHORIZED_PROMOTION_SHA"
          test "$rebuilt" = "$AUTHORIZED_PROMOTION_SHA"
          echo "trusted promotion proof independently rebuilt and matched authorization"

      - name: Mint short-lived Vercel Trusted Source identity
        id: vercel-oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Mint short-lived Google caller ID token via GitHub OIDC
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.PROOFOS_E2E_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.PROOFOS_E2E_GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ needs.authorize.outputs.target_origin }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      - name: Collect fresh authenticated signed evidence
        env:
          PROOFOS_E2E_CALLER_ID_TOKEN: ${{ steps.google-auth.outputs.id_token }}
          PROOFOS_E2E_COLLECTOR_PUBLIC_KEY: ${{ secrets.PROOFOS_E2E_COLLECTOR_PUBLIC_KEY }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel-oidc.outputs.token }}
          DEPLOYMENT_URL: ${{ needs.authorize.outputs.target_origin }}
          EXPECTED_GIT_SHA: ${{ needs.authorize.outputs.source_git_sha }}
        run: |
          uv run python scripts/verify_authenticated_collection.py             --url "$DEPLOYMENT_URL"             --expected-git-sha "$EXPECTED_GIT_SHA"             --output "artifacts/authenticated-e2e/collection-${{ github.run_id }}.json"

      - name: Independently verify persisted authenticated evidence
        env:
          PROOFOS_E2E_COLLECTOR_PUBLIC_KEY: ${{ secrets.PROOFOS_E2E_COLLECTOR_PUBLIC_KEY }}
          EXPECTED_GIT_SHA: ${{ needs.authorize.outputs.source_git_sha }}
        run: |
          uv run python scripts/verify_authenticated_collection_artifact.py             "artifacts/authenticated-e2e/collection-${{ github.run_id }}.json"             --expected-git-sha "$EXPECTED_GIT_SHA"

      - name: Cross-check authenticated evidence against sealed launch bundle
        env:
          PROOFOS_E2E_COLLECTOR_PUBLIC_KEY: ${{ secrets.PROOFOS_E2E_COLLECTOR_PUBLIC_KEY }}
          SOURCE_RUN_ID: ${{ needs.authorize.outputs.source_run_id }}
          EXPECTED_GIT_SHA: ${{ needs.authorize.outputs.source_git_sha }}
        run: |
          args=(
            "artifacts/launch-gate/health/vercel-$SOURCE_RUN_ID.json"
            "artifacts/launch-gate/trust/vercel-trust-$SOURCE_RUN_ID.json"
            "artifacts/launch-gate/manifest/vercel-manifest-$SOURCE_RUN_ID.json"
            "artifacts/launch-gate/verdict/vercel-launch-verdict-$SOURCE_RUN_ID.json"
            "artifacts/authenticated-e2e/collection-${{ github.run_id }}.json"
            --expected-git-sha "$EXPECTED_GIT_SHA"
            --source-run-id "$SOURCE_RUN_ID"
            --output "artifacts/authenticated-e2e/promotion-${{ github.run_id }}.json"
          )
          if [[ -f "artifacts/launch-gate/trusted-promotion-$SOURCE_RUN_ID.json" ]]; then
            args+=(
              --trusted-source "artifacts/launch-gate/trusted/vercel-trusted-source-$SOURCE_RUN_ID.json"
              --trusted-promotion "artifacts/launch-gate/trusted-promotion-$SOURCE_RUN_ID.json"
            )
          fi
          uv run python scripts/verify_authenticated_e2e_promotion.py "${args[@]}"

      - name: Upload authenticated collection evidence
        uses: actions/upload-artifact@v7
        with:
          name: proofos-authenticated-e2e-${{ github.run_id }}
          path: artifacts/authenticated-e2e/collection-${{ github.run_id }}.json
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload authenticated promotion evidence
        uses: actions/upload-artifact@v7
        with:
          name: proofos-authenticated-promotion-${{ github.run_id }}
          path: artifacts/authenticated-e2e/promotion-${{ github.run_id }}.json
          archive: false
          if-no-files-found: error
          retention-days: 30
