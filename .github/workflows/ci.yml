name: CI

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run verifier tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q proofos proofos_agent
