name: PR11 refresh recorded test count

on:
  push:
    branches: [postsubmit/worldclass-demo-captions]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: postsubmit/worldclass-demo-captions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover and record the exact suite size
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          import unittest

          def walk(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from walk(item)
                  else:
                      yield item

          root = pathlib.Path('.')
          count = len(list(walk(unittest.TestLoader().discover('tests', top_level_dir='.'))))
          if count != 557:
              raise SystemExit(f'refusing unexpected discovered count: {count} != 557')

          cloud = root / 'artifacts/cloud-proof.json'
          data = json.loads(cloud.read_text(encoding='utf-8'))
          data['test_count'] = count
          cloud.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          bundle = root / 'web/proof-bundle.json'
          b = json.loads(bundle.read_text(encoding='utf-8'))
          b['project']['test_count'] = count
          bundle.write_text(json.dumps(b, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8')
          updated, n = re.subn(r'\*\*553 tests\.\*\*', f'**{count} tests.**', text)
          if n != 1:
              raise SystemExit(f'expected one README count replacement, got {n}')
          readme.write_text(updated, encoding='utf-8')
          print(f'recorded test_count={count}')
          PY
      - name: Commit only the three evidence surfaces
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/cloud-proof.json web/proof-bundle.json README.md
          git diff --cached --exit-code && { echo 'no count update produced'; exit 1; } || true
          git commit -m 'chore: record 557 discovered tests'
          git push origin HEAD:postsubmit/worldclass-demo-captions
