name: Vercel Live Smoke Evidence

on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      (
        contains(github.event.deployment_status.environment_url, '.vercel.app') ||
        contains(github.event.deployment_status.target_url, '.vercel.app')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve deployed Vercel origin
        id: deployment
        shell: bash
        env:
          ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          url="$ENVIRONMENT_URL"
          if [[ "$url" != *".vercel.app"* ]]; then
            url="$TARGET_URL"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Validate smoke verifier locally
        run: python scripts/verify_vercel_live_smoke.py --self-test

      - name: Observe live collector
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          python scripts/verify_vercel_live_smoke.py \
            --url "$DEPLOYMENT_URL" \
            --output "artifacts/live-smoke/vercel-${{ github.run_id }}.json" \
            --record-protection-block \
            --expected-git-sha "$GITHUB_SHA" \
            --github-deployment-id "${{ github.event.deployment.id }}" \
            --github-deployment-status-id "${{ github.event.deployment_status.id }}" \
            --github-environment "${{ github.event.deployment.environment }}" \
            --environment-url "$DEPLOYMENT_URL"

      - name: Verify persisted smoke evidence independently
        run: python scripts/verify_live_smoke_artifact.py "artifacts/live-smoke/vercel-${{ github.run_id }}.json"

      - name: Observe live trust surface
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          python scripts/verify_vercel_live_trust.py \
            --url "$DEPLOYMENT_URL" \
            --output "artifacts/live-smoke/vercel-trust-${{ github.run_id }}.json" \
            --expected-git-sha "$GITHUB_SHA" \
            --github-deployment-id "${{ github.event.deployment.id }}" \
            --github-deployment-status-id "${{ github.event.deployment_status.id }}" \
            --github-environment "${{ github.event.deployment.environment }}" \
            --environment-url "$DEPLOYMENT_URL"

      - name: Verify persisted trust evidence independently
        run: python scripts/verify_live_trust_artifact.py "artifacts/live-smoke/vercel-trust-${{ github.run_id }}.json"

      - name: Verify live evidence pair consistency
        run: |
          python scripts/verify_live_evidence_pair.py \
            "artifacts/live-smoke/vercel-${{ github.run_id }}.json" \
            "artifacts/live-smoke/vercel-trust-${{ github.run_id }}.json" \
            --expected-git-sha "$GITHUB_SHA" \
            --output "artifacts/live-smoke/vercel-manifest-${{ github.run_id }}.json"

      - name: Verify live evidence manifest independently
        run: |
          python scripts/verify_live_evidence_manifest.py \
            "artifacts/live-smoke/vercel-${{ github.run_id }}.json" \
            "artifacts/live-smoke/vercel-trust-${{ github.run_id }}.json" \
            "artifacts/live-smoke/vercel-manifest-${{ github.run_id }}.json" \
            --expected-git-sha "$GITHUB_SHA"

      - name: Upload live health evidence
        uses: actions/upload-artifact@v7
        with:
          name: vercel-live-health-${{ github.run_id }}
          path: artifacts/live-smoke/vercel-${{ github.run_id }}.json
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload live trust evidence
        uses: actions/upload-artifact@v7
        with:
          name: vercel-live-trust-${{ github.run_id }}
          path: artifacts/live-smoke/vercel-trust-${{ github.run_id }}.json
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload live evidence manifest
        uses: actions/upload-artifact@v7
        with:
          name: vercel-live-manifest-${{ github.run_id }}
          path: artifacts/live-smoke/vercel-manifest-${{ github.run_id }}.json
          archive: false
          if-no-files-found: error
          retention-days: 30
