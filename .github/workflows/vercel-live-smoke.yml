name: Vercel Live Smoke Evidence

on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      (
        contains(github.event.deployment_status.environment_url, '.vercel.app') ||
        contains(github.event.deployment_status.target_url, '.vercel.app')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve deployed Vercel origin
        id: deployment
        shell: bash
        env:
          ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          url="$ENVIRONMENT_URL"
          if [[ "$url" != *".vercel.app"* ]]; then
            url="$TARGET_URL"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Validate smoke verifier locally
        run: python scripts/verify_vercel_live_smoke.py --self-test

      - name: Observe live collector
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          python scripts/verify_vercel_live_smoke.py \
            --url "$DEPLOYMENT_URL" \
            --output "artifacts/live-smoke/vercel-${{ github.run_id }}.json" \
            --record-protection-block \
            --expected-git-sha "$GITHUB_SHA" \
            --github-deployment-id "${{ github.event.deployment.id }}" \
            --github-deployment-status-id "${{ github.event.deployment_status.id }}" \
            --github-environment "${{ github.event.deployment.environment }}" \
            --environment-url "$DEPLOYMENT_URL"

      - name: Verify persisted smoke evidence independently
        run: python scripts/verify_live_smoke_artifact.py "artifacts/live-smoke/vercel-${{ github.run_id }}.json"

      - name: Observe live trust surface
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          python scripts/verify_vercel_live_trust.py \
            --url "$DEPLOYMENT_URL" \
            --output "artifacts/live-smoke/vercel-trust-${{ github.run_id }}.json" \
            --expected-git-sha "$GITHUB_SHA" \
            --github-deployment-id "${{ github.event.deployment.id }}" \
            --github-deployment-status-id "${{ github.event.deployment_status.id }}" \
            --github-environment "${{ github.event.deployment.environment }}" \
            --environment-url "$DEPLOYMENT_URL"

      - name: Verify persisted trust evidence independently
        run: python scripts/verify_live_trust_artifact.py "artifacts/live-smoke/vercel-trust-${{ github.run_id }}.json"

      - name: Verify live evidence pair consistency
        run: |
          python scripts/verify_live_evidence_pair.py \
            "artifacts/live-smoke/vercel-${{ github.run_id }}.json" \
            "artifacts/live-smoke/vercel-trust-${{ github.run_id }}.json" \
            --expected-git-sha "$GITHUB_SHA" \
            --output "artifacts/live-smoke/vercel-manifest-${{ github.run_id }}.json"

      - name: Verify live evidence manifest independently
        run: |
          python scripts/verify_live_evidence_manifest.py \
            "artifacts/live-smoke/vercel-${{ github.run_id }}.json" \
            "artifacts/live-smoke/vercel-trust-${{ github.run_id }}.json" \
            "artifacts/live-smoke/vercel-manifest-${{ github.run_id }}.json" \
            --expected-git-sha "$GITHUB_SHA"

      - name: Build conservative launch verdict
        run: |
          python scripts/build_live_launch_verdict.py \
            "artifacts/live-smoke/vercel-${{ github.run_id }}.json" \
            "artifacts/live-smoke/vercel-trust-${{ github.run_id }}.json" \
            "artifacts/live-smoke/vercel-manifest-${{ github.run_id }}.json" \
            --expected-git-sha "$GITHUB_SHA" \
            --output "artifacts/live-smoke/vercel-launch-verdict-${{ github.run_id }}.json"

      - name: Verify launch verdict independently
        run: |
          python scripts/verify_live_launch_verdict.py \
            "artifacts/live-smoke/vercel-${{ github.run_id }}.json" \
            "artifacts/live-smoke/vercel-trust-${{ github.run_id }}.json" \
            "artifacts/live-smoke/vercel-manifest-${{ github.run_id }}.json" \
            "artifacts/live-smoke/vercel-launch-verdict-${{ github.run_id }}.json" \
            --expected-git-sha "$GITHUB_SHA"

      - name: Upload live health evidence
        uses: actions/upload-artifact@v7
        with:
          name: vercel-live-health-${{ github.run_id }}
          path: artifacts/live-smoke/vercel-${{ github.run_id }}.json
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload live trust evidence
        uses: actions/upload-artifact@v7
        with:
          name: vercel-live-trust-${{ github.run_id }}
          path: artifacts/live-smoke/vercel-trust-${{ github.run_id }}.json
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload live evidence manifest
        uses: actions/upload-artifact@v7
        with:
          name: vercel-live-manifest-${{ github.run_id }}
          path: artifacts/live-smoke/vercel-manifest-${{ github.run_id }}.json
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload live launch verdict
        uses: actions/upload-artifact@v7
        with:
          name: vercel-live-launch-verdict-${{ github.run_id }}
          path: artifacts/live-smoke/vercel-launch-verdict-${{ github.run_id }}.json
          archive: false
          if-no-files-found: error
          retention-days: 30

  trusted-source-authorize:
    if: >-
      github.event.deployment_status.state == 'success' &&
      (
        github.event.deployment.environment == 'Production' ||
        github.event.deployment.environment == 'production'
      ) &&
      (
        contains(github.event.deployment_status.environment_url, '.vercel.app') ||
        contains(github.event.deployment_status.target_url, '.vercel.app')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
      source_git_sha: ${{ steps.authorize.outputs.source_git_sha }}
      deployment_url: ${{ steps.authorize.outputs.deployment_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Authorize trusted-source production deployment
        id: authorize
        shell: bash
        env:
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          set -euo pipefail
          sha="${DEPLOYMENT_SHA,,}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "deployment SHA is not a full Git commit SHA"
            exit 1
          }

          url="$ENVIRONMENT_URL"
          if [[ "$url" != *".vercel.app"* ]]; then
            url="$TARGET_URL"
          fi
          [[ "$url" == https://*.vercel.app || "$url" == https://*.vercel.app/ ]] || {
            echo "trusted-source target is not an exact Vercel deployment origin"
            exit 1
          }
          url="${url%/}"

          git fetch --no-tags origin main
          git cat-file -e "$sha^{commit}" || {
            echo "deployment SHA is not available in repository history"
            exit 1
          }

          if git merge-base --is-ancestor "$sha" origin/main; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            echo "source_git_sha=$sha" >> "$GITHUB_OUTPUT"
            echo "deployment_url=$url" >> "$GITHUB_OUTPUT"
            echo "trusted-source deployment is contained in main history"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            echo "source_git_sha=$sha" >> "$GITHUB_OUTPUT"
            echo "deployment_url=$url" >> "$GITHUB_OUTPUT"
            echo "trusted-source deployment is not contained in main history"
          fi

  trusted-source:
    needs: trusted-source-authorize
    if: needs.trusted-source-authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve trusted production origin
        id: deployment
        shell: bash
        env:
          AUTHORIZED_URL: ${{ needs.trusted-source-authorize.outputs.deployment_url }}
        run: |
          set -euo pipefail
          [[ "$AUTHORIZED_URL" == https://*.vercel.app ]] || {
            echo "authorized trusted-source origin is invalid"
            exit 1
          }
          echo "url=$AUTHORIZED_URL" >> "$GITHUB_OUTPUT"

      - name: Mint short-lived GitHub OIDC identity
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Validate trusted-source probe locally
        run: |
          python scripts/verify_vercel_trusted_source.py --self-test
          python scripts/verify_vercel_trusted_source_artifact.py --self-test

      - name: Observe Vercel Trusted Source boundary
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          python scripts/verify_vercel_trusted_source.py \
            --url "$DEPLOYMENT_URL" \
            --output "artifacts/live-smoke/vercel-trusted-source-${{ github.run_id }}.json" \
            --expected-git-sha "${{ needs.trusted-source-authorize.outputs.source_git_sha }}" \
            --github-deployment-id "${{ github.event.deployment.id }}" \
            --github-deployment-status-id "${{ github.event.deployment_status.id }}" \
            --github-environment "${{ github.event.deployment.environment }}" \
            --environment-url "$DEPLOYMENT_URL"

      - name: Verify trusted-source evidence independently
        run: |
          python scripts/verify_vercel_trusted_source_artifact.py \
            "artifacts/live-smoke/vercel-trusted-source-${{ github.run_id }}.json"

      - name: Upload trusted-source evidence
        uses: actions/upload-artifact@v7
        with:
          name: vercel-trusted-source-${{ github.run_id }}.json
          path: artifacts/live-smoke/vercel-trusted-source-${{ github.run_id }}.json
          archive: false
          if-no-files-found: error
          retention-days: 30

